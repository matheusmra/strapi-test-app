<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebTech News Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1120; color: white; }
        .webtech-gradient { background: linear-gradient(135deg, #ffb400 0%, #e6a200 100%); }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navbar -->
    <nav class="border-b border-gray-800 bg-gray-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 webtech-gradient rounded-lg flex items-center justify-center font-bold text-black">W</div>
                <h1 class="text-xl font-bold tracking-tight">WebTech <span class="text-[#ffb400]">News</span></h1>
            </div>
            <div class="hidden md:flex gap-6 text-sm font-medium text-gray-400">
                <a href="#" class="hover:text-[#ffb400] transition-colors">Tecnologia</a>
                <a href="#" class="hover:text-[#ffb400] transition-colors">Desenvolvimento</a>
                <a href="#" class="hover:text-[#ffb400] transition-colors">Infraestrutura</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="max-w-7xl mx-auto px-4 py-12">
        <div class="webtech-gradient p-1 rounded-2xl">
            <div class="bg-gray-900 rounded-[14px] p-8 md:p-12 flex flex-col md:flex-row gap-8 items-center">
                <div class="flex-1">
                    <span class="text-[#ffb400] text-sm font-bold uppercase tracking-widest">Destaque</span>
                    <h2 id="hero-title" class="text-3xl md:text-5xl font-extrabold mt-4 leading-tight">Conectando ao Strapi...</h2>
                    <p id="hero-excerpt" class="text-gray-400 mt-6 text-lg">Seus artigos aparecerão aqui assim que você cadastrá-los e publicá-los no Strapi.</p>
                </div>
                <div id="hero-image" class="w-full md:w-1/2 aspect-video bg-gray-800 rounded-xl overflow-hidden flex items-center justify-center text-gray-600">
                    <span class="material-symbols-outlined text-5xl">image</span>
                </div>
            </div>
        </div>
    </header>

    <!-- News Grid -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <h3 class="text-2xl font-bold mb-8 flex items-center gap-3">
            <span class="w-2 h-8 webtech-gradient rounded-full"></span>
            Últimas Notícias
        </h3>
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Os cards entrarão aqui -->
        </div>
    </main>

    <footer class="border-t border-gray-800 py-12 mt-12 text-center text-gray-500 text-sm">
        <p>&copy; 2026 WebTech Network. Integrado via API.</p>
    </footer>

    <script>
        const STRAPI_URL = 'http://localhost:1337';

        async function fetchNews() {
            try {
                const response = await fetch(`${STRAPI_URL}/api/articles?populate=*`);
                const { data } = await response.json();
                
                if (data && data.length > 0) {
                    renderNews(data);
                } else {
                    document.getElementById('hero-title').innerText = "Aguardando Notícias...";
                    document.getElementById('hero-excerpt').innerText = "Vá ao Strapi (localhost:1337) e publique seu primeiro Artigo.";
                }
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('hero-title').innerText = "Servidor Offline";
                document.getElementById('hero-excerpt').innerText = "Certifique-se que o Strapi está rodando em localhost:1337.";
            }
        }

        function parseContent(content) {
            if (!content) return "";
            // Se for o novo editor de Blocos (JSON/Array)
            if (Array.isArray(content)) {
                return content
                    .map(block => block.children ? block.children.map(c => c.text).join('') : '')
                    .join(' ');
            }
            // Se for String (Rich Text/Markdown)
            return content;
        }

        function renderNews(articles) {
            // Hero
            const hero = articles[0].attributes;
            document.getElementById('hero-title').innerText = hero.title || "Sem Título";
            
            const heroBody = hero.excerpt || parseContent(hero.content) || "Sem descrição disponível.";
            document.getElementById('hero-excerpt').innerText = heroBody;
            
            if (hero.cover?.data) {
                const imgUrl = `${STRAPI_URL}${hero.cover.data.attributes.url}`;
                document.getElementById('hero-image').innerHTML = `<img src="${imgUrl}" class="w-full h-full object-cover" />`;
            }

            // Grid
            const grid = document.getElementById('news-grid');
            grid.innerHTML = articles.map(article => {
                const attr = article.attributes;
                const imgUrl = attr.cover?.data ? `${STRAPI_URL}${attr.cover.data.attributes.url}` : 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=80&w=400';
                const body = attr.excerpt || parseContent(attr.content) || "";

                return `
                    <article class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden hover:border-[#ffb400] transition-all group">
                        <div class="aspect-video overflow-hidden">
                            <img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                        </div>
                        <div class="p-6">
                            <h4 class="text-xl font-bold mt-2 group-hover:text-[#ffb400] transition-colors">${attr.title || "Nova Notícia"}</h4>
                            <p class="text-gray-400 text-sm mt-3 line-clamp-3">${body}</p>
                            <div class="mt-6 pt-6 border-t border-gray-800 flex items-center justify-between text-xs text-gray-500">
                                <span>WebTech News</span>
                                <span>${new Date(attr.createdAt).toLocaleDateString()}</span>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        fetchNews();
    </script>
</body>
</html>
